[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bgremove"
version = "0.1.0"
dependencies = [
  "typer",
  "rich",
  "pillow",
  "numpy",
  "opencv-python",
  "torch",
  "torchvision",
  "transformers",
  "huggingface-hub",
  "pydantic",
  "einops",
  "kornia",
  "timm",
  "gradio"
]

[project.scripts]
bgremove = "bgremove.cli:app"
bgremove-gui = "bgremove.gui:launch_gui"

[tool.setuptools.packages.find]
include = ["bgremove*"]
